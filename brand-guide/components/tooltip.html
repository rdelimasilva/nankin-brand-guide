<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Nankin · Tooltip</title>
<link rel="stylesheet" href="../_shell.css">

<style>
.cmp-demo { padding: 32px; background: var(--bg-alt); border-radius: var(--r-md); display: flex; flex-wrap: wrap; gap: 12px; align-items: center; }
.cmp-demo--white { background: var(--nk-white); border: 1px solid var(--border); }
.cmp-demo--col { flex-direction: column; align-items: stretch; }
.cmp-spec table { width: 100%; border-collapse: collapse; font-size: 14px; margin-top: 12px; }
.cmp-spec th { text-align: left; padding: 10px 0; border-bottom: 1px solid var(--border); font-size: 10px; letter-spacing: var(--tr-mega); text-transform: uppercase; color: var(--fg-subtle); font-weight: 600; }
.cmp-spec td { padding: 10px 16px 10px 0; border-bottom: 1px solid var(--border); vertical-align: top; }
.cmp-spec td:first-child { font-family: var(--font-mono); font-size: 12px; color: var(--fg-muted); width: 30%; }
.btn { display: inline-flex; align-items: center; gap: 8px; padding: 10px 18px; border-radius: var(--r-md); font-size: 14px; font-weight: 500; cursor: pointer; border: 1px solid transparent; font-family: inherit; transition: all 120ms var(--ease-out); }
.btn--primary { background: var(--nk-coral); color: #fff; }
.btn--secondary { background: var(--nk-black); color: #fff; }
.btn--ghost { background: transparent; color: var(--fg); border-color: var(--border); }
.btn--text { background: transparent; color: var(--fg); }
.btn--sm { padding: 6px 12px; font-size: 13px; }
.input { width: 100%; padding: 10px 14px; border: 1px solid var(--border-strong); border-radius: var(--r-md); font-size: 14px; font-family: inherit; background: #fff; }
.input:focus { outline: 2px solid var(--nk-coral); outline-offset: 1px; border-color: var(--nk-black); }
.field { display: grid; gap: 6px; }
.field label { font-size: 12px; font-weight: 500; color: var(--fg-muted); }
.field .hint { font-size: 12px; color: var(--fg-subtle); }
</style>
</head>
<body data-page="c-tooltip">
<div class="nk-hero">
  <div class="nk-eyebrow">C14 · Componentes · Tooltip</div>
  <div class="nk-hero__rule"></div>
  <h1 class="nk-h1">Tooltip.</h1>
  <p class="nk-lede">Texto curto que explica um ícone sem label. Se o conteúdo precisa formatar, use popover.</p>
</div>
<div class="nk-page">

  <h2 class="nk-h2">Padrão</h2>
  <div class="cmp-demo cmp-demo--center" style="padding: 60px 32px;">
    <div style="position: relative; display: inline-block;">
      <button class="btn btn--ghost" style="padding: 8px;"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg></button>
      <div style="position: absolute; bottom: calc(100% + 8px); left: 50%; transform: translateX(-50%); background: var(--nk-black); color: #fff; padding: 6px 10px; border-radius: 6px; font-size: 12px; white-space: nowrap;">Comentários do projeto<span style="position: absolute; top: 100%; left: 50%; transform: translateX(-50%); border: 4px solid transparent; border-top-color: var(--nk-black);"></span></div>
    </div>
  </div>

  <h2 class="nk-h2">Especificação</h2>
  <div class="cmp-spec"><table><thead><tr><th>Token</th><th>Valor</th></tr></thead><tbody>
    <tr><td>background</td><td>--nk-black</td></tr>
    <tr><td>color</td><td>--nk-white</td></tr>
    <tr><td>padding</td><td>6px 10px</td></tr>
    <tr><td>font-size</td><td>12px</td></tr>
    <tr><td>delay</td><td>500ms hover</td></tr>
  </tbody></table></div>
  
  <div class="nk-footer">
    <a href="badge.html">← C13 · Badge</a>
    <a href="modal.html">C15 · Modal →</a>
  </div>
</div>
<script src="../_layout.js"></script>
</body>
</html>
