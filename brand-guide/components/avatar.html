<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Nankin · Avatar</title>
<link rel="stylesheet" href="../_shell.css">

<style>
.cmp-demo { padding: 32px; background: var(--bg-alt); border-radius: var(--r-md); display: flex; flex-wrap: wrap; gap: 12px; align-items: center; }
.cmp-demo--white { background: var(--nk-white); border: 1px solid var(--border); }
.cmp-demo--col { flex-direction: column; align-items: stretch; }
.cmp-spec table { width: 100%; border-collapse: collapse; font-size: 14px; margin-top: 12px; }
.cmp-spec th { text-align: left; padding: 10px 0; border-bottom: 1px solid var(--border); font-size: 10px; letter-spacing: var(--tr-mega); text-transform: uppercase; color: var(--fg-subtle); font-weight: 600; }
.cmp-spec td { padding: 10px 16px 10px 0; border-bottom: 1px solid var(--border); vertical-align: top; }
.cmp-spec td:first-child { font-family: var(--font-mono); font-size: 12px; color: var(--fg-muted); width: 30%; }
.btn { display: inline-flex; align-items: center; gap: 8px; padding: 10px 18px; border-radius: var(--r-md); font-size: 14px; font-weight: 500; cursor: pointer; border: 1px solid transparent; font-family: inherit; transition: all 120ms var(--ease-out); }
.btn--primary { background: var(--nk-coral); color: #fff; }
.btn--secondary { background: var(--nk-black); color: #fff; }
.btn--ghost { background: transparent; color: var(--fg); border-color: var(--border); }
.btn--text { background: transparent; color: var(--fg); }
.btn--sm { padding: 6px 12px; font-size: 13px; }
.input { width: 100%; padding: 10px 14px; border: 1px solid var(--border-strong); border-radius: var(--r-md); font-size: 14px; font-family: inherit; background: #fff; }
.input:focus { outline: 2px solid var(--nk-coral); outline-offset: 1px; border-color: var(--nk-black); }
.field { display: grid; gap: 6px; }
.field label { font-size: 12px; font-weight: 500; color: var(--fg-muted); }
.field .hint { font-size: 12px; color: var(--fg-subtle); }
</style>
</head>
<body data-page="c-avatar">
<div class="nk-hero">
  <div class="nk-eyebrow">C12 · Componentes · Avatar</div>
  <div class="nk-hero__rule"></div>
  <h1 class="nk-h1">Avatar.</h1>
  <p class="nk-lede">Iniciais sobre fundo neutro. Foto quando disponível. Nunca emoji.</p>
</div>
<div class="nk-page">

  <style>
  .av { display: inline-flex; align-items: center; justify-content: center; border-radius: 50%; color: #fff; font-weight: 500; }
  .av--xs { width: 20px; height: 20px; font-size: 9px; }
  .av--sm { width: 28px; height: 28px; font-size: 11px; }
  .av--md { width: 40px; height: 40px; font-size: 14px; }
  .av--lg { width: 56px; height: 56px; font-size: 18px; }
  .av--xl { width: 80px; height: 80px; font-size: 26px; }
  </style>
  <h2 class="nk-h2">Tamanhos</h2>
  <div class="cmp-demo">
    <span class="av av--xs" style="background:#1f3a5f;">MA</span>
    <span class="av av--sm" style="background:#1f3a5f;">MA</span>
    <span class="av av--md" style="background:#1f3a5f;">MA</span>
    <span class="av av--lg" style="background:#1f3a5f;">MA</span>
    <span class="av av--xl" style="background:#1f3a5f;">MA</span>
  </div>

  <h2 class="nk-h2">Cores (gerada por hash do nome)</h2>
  <div class="cmp-demo">
    <span class="av av--md" style="background:#1f3a5f;">MA</span>
    <span class="av av--md" style="background:#2c5d3f;">RF</span>
    <span class="av av--md" style="background:#7a3f2c;">JL</span>
    <span class="av av--md" style="background:#5a3a6f;">CN</span>
    <span class="av av--md" style="background:var(--nk-black);">PT</span>
    <span class="av av--md" style="background:var(--nk-coral);">EX</span>
  </div>

  <h2 class="nk-h2">Grupo (stack)</h2>
  <div class="cmp-demo">
    <div style="display:inline-flex;">
      <span class="av av--md" style="background:#1f3a5f; border: 2px solid #fff;">MA</span>
      <span class="av av--md" style="background:#2c5d3f; border: 2px solid #fff; margin-left: -10px;">RF</span>
      <span class="av av--md" style="background:#7a3f2c; border: 2px solid #fff; margin-left: -10px;">JL</span>
      <span class="av av--md" style="background:var(--bg-alt); color: var(--fg-muted); border: 2px solid #fff; margin-left: -10px; font-size: 12px;">+4</span>
    </div>
  </div>
  
  <div class="nk-footer">
    <a href="switch.html">← C11 · Switch</a>
    <a href="badge.html">C13 · Badge →</a>
  </div>
</div>
<script src="../_layout.js"></script>
</body>
</html>
