<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Nankin · Tipografia · Pesos</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  body { margin: 0; padding: 24px 32px; background: var(--bg); }
  .row { display: grid; grid-template-columns: 130px 1fr; gap: 16px; align-items: baseline; padding: 4px 0; }
  .meta { font-family: var(--font-text); font-weight: 500; font-size: 10px; letter-spacing: var(--tr-mega); text-transform: uppercase; color: var(--fg-muted); }
  .sample { font-family: "Nobel Uno", sans-serif; font-size: 28px; line-height: 1.15; letter-spacing: -0.02em; color: var(--fg); }
  .group { font-family: var(--font-text); font-size: 11px; font-weight: 600; letter-spacing: var(--tr-mega); text-transform: uppercase; color: var(--nk-coral); margin: 0 0 12px; }
</style>
</head>
<body>
  <div class="group">Nobel Uno · a única fonte do sistema</div>
  <div class="row"><div class="meta">thin · 100</div><div class="sample" style="font-weight:100;">nankin gestão</div></div>
  <div class="row"><div class="meta">light · 300</div><div class="sample" style="font-weight:300;">nankin gestão</div></div>
  <div class="row"><div class="meta">regular · 400</div><div class="sample" style="font-weight:400;">nankin gestão</div></div>
  <div class="row"><div class="meta">medium · 500</div><div class="sample" style="font-weight:500;">nankin gestão</div></div>
  <div class="row"><div class="meta">semibold · 600</div><div class="sample" style="font-weight:600;">nankin gestão</div></div>
  <div class="row"><div class="meta">bold · 700</div><div class="sample" style="font-weight:700;">nankin gestão</div></div>
  <div class="row"><div class="meta">black · 900</div><div class="sample" style="font-weight:900;">nankin gestão</div></div>
</body>
</html>
