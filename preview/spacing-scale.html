<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Nankin · Espaçamento</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  body { margin: 0; padding: 24px 28px; background: var(--bg); }
  .row { display: grid; grid-template-columns: 80px 1fr 60px; align-items: center; gap: 12px; padding: 6px 0; }
  .meta { font-family: var(--font-text); font-size: 12px; letter-spacing: 0.04em; color: var(--fg-muted); font-weight: 600; }
  .bar { height: 14px; background: var(--nk-coral); border-radius: 2px; }
  .px { font-family: var(--font-mono); font-size: 11px; color: var(--fg-subtle); text-align: right; }
</style>
</head>
<body>
  <div class="row"><div class="meta">sp-1</div><div class="bar" style="width:4px;"></div><div class="px">4px</div></div>
  <div class="row"><div class="meta">sp-2</div><div class="bar" style="width:8px;"></div><div class="px">8px</div></div>
  <div class="row"><div class="meta">sp-3</div><div class="bar" style="width:12px;"></div><div class="px">12px</div></div>
  <div class="row"><div class="meta">sp-4</div><div class="bar" style="width:16px;"></div><div class="px">16px</div></div>
  <div class="row"><div class="meta">sp-5</div><div class="bar" style="width:24px;"></div><div class="px">24px</div></div>
  <div class="row"><div class="meta">sp-6</div><div class="bar" style="width:32px;"></div><div class="px">32px</div></div>
  <div class="row"><div class="meta">sp-7</div><div class="bar" style="width:48px;"></div><div class="px">48px</div></div>
  <div class="row"><div class="meta">sp-8</div><div class="bar" style="width:64px;"></div><div class="px">64px</div></div>
  <div class="row"><div class="meta">sp-9</div><div class="bar" style="width:96px;"></div><div class="px">96px</div></div>
  <div class="row"><div class="meta">sp-10</div><div class="bar" style="width:128px;"></div><div class="px">128px</div></div>
</body>
</html>
