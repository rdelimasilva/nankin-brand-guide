<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Nankin · Radii</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  body { margin: 0; padding: 28px; background: var(--bg); display: flex; gap: 18px; align-items: flex-end; }
  .item { display: flex; flex-direction: column; align-items: center; gap: 8px; }
  .box { width: 72px; height: 72px; background: var(--nk-coral); }
  .meta { font-family: var(--font-text); font-size: 11px; letter-spacing: 0.04em; color: var(--fg-muted); }
  .px { font-family: var(--font-mono); font-size: 10px; color: var(--fg-subtle); }
</style>
</head>
<body>
  <div class="item"><div class="box" style="border-radius: 0;"></div><div class="meta">r-0</div><div class="px">0</div></div>
  <div class="item"><div class="box" style="border-radius: 4px;"></div><div class="meta">r-sm</div><div class="px">4</div></div>
  <div class="item"><div class="box" style="border-radius: 8px;"></div><div class="meta">r-md</div><div class="px">8</div></div>
  <div class="item"><div class="box" style="border-radius: 12px;"></div><div class="meta">r-lg</div><div class="px">12</div></div>
  <div class="item"><div class="box" style="border-radius: 20px;"></div><div class="meta">r-xl</div><div class="px">20</div></div>
  <div class="item"><div class="box" style="border-radius: 999px;"></div><div class="meta">r-pill</div><div class="px">999</div></div>
</body>
</html>
