<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Nankin · Logo principal</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  body { margin: 0; padding: 32px; background: var(--bg); display: flex; align-items: center; gap: 32px; min-height: 86px; }
  .lockup { display: flex; align-items: center; gap: 14px; }
  .mark { width: 48px; height: 48px; display: grid; place-items: center; }
  .mark img { width: 36px; height: 36px; }
  .word { font-family: var(--font-wordmark); font-weight: 700; font-size: 40px; letter-spacing: -0.04em; line-height: 1; color: var(--fg); }
  .meta { margin-left: auto; font-family: var(--font-text); font-size: 10px; font-weight: 500; letter-spacing: var(--tr-mega); text-transform: uppercase; color: var(--fg-muted); }
</style>
</head>
<body>
  <div class="lockup">
    <div class="mark">
      <img src="../assets/icon-nankin.svg" alt="" style="filter: brightness(0);">
    </div>
    <div class="word">nankin</div>
  </div>
  <div class="meta">Imagotipo · principal</div>
</body>
</html>
