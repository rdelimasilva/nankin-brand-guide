<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Nankin · Eyebrow + headline rhythm</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  body { margin: 0; padding: 32px; background: var(--bg); display: grid; gap: 26px; }
  .block { display: grid; gap: 6px; }
  .eyebrow { font-family: var(--font-text); font-size: 11px; font-weight: 600; letter-spacing: var(--tr-mega); text-transform: uppercase; color: var(--fg-muted); }
  .head { font-family: var(--font-display); font-weight: 700; font-size: 40px; letter-spacing: -0.025em; line-height: 1.05; color: var(--fg); margin: 0; }
  .rule { width: 32px; height: 2px; background: var(--nk-coral); margin: 4px 0 8px; }
</style>
</head>
<body>
  <div class="block">
    <div class="eyebrow">01 · Plataforma</div>
    <div class="rule"></div>
    <h2 class="head">Gestão eficiente para arquitetos.</h2>
  </div>
  <div class="block">
    <div class="eyebrow">02 · Recursos</div>
    <div class="rule"></div>
    <h2 class="head">Tudo que um escritório precisa.</h2>
  </div>
</body>
</html>
