<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Nankin · Mono</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  body { margin: 0; padding: 28px 32px; background: var(--bg); }
  pre { margin: 0; font-family: var(--font-mono); font-size: 14px; line-height: 1.55; color: var(--fg); }
  .row { display: flex; gap: 8px; align-items: center; margin-bottom: 18px; flex-wrap: wrap; }
  code { font-family: var(--font-mono); font-size: 13px; background: var(--nk-gray-light); border-radius: var(--r-sm); padding: 3px 8px; color: var(--fg); }
  .meta { font-family: var(--font-text); font-size: 10px; letter-spacing: var(--tr-mega); text-transform: uppercase; color: var(--fg-muted); margin-right: 8px; }
  .key { color: var(--fg-subtle); }
  .str { color: var(--nk-coral-deep); }
</style>
</head>
<body>
  <div class="row">
    <span class="meta">tokens</span>
    <code>--nk-coral</code>
    <code>--font-display</code>
    <code>--sp-5</code>
    <code>--r-pill</code>
  </div>
<pre><span class="key">// JetBrains Mono · 14px</span>
const brand = {
  coral:      <span class="str">"#FE6E60"</span>,
  black:      <span class="str">"#000000"</span>,
  gray:       <span class="str">"#2E2E2E"</span>,
  grayLight:  <span class="str">"#F5F5F5"</span>,
  white:      <span class="str">"#FFFFFF"</span>,
};</pre>
</body>
</html>
