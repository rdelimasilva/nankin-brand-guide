<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Nankin · Tipografia · Display</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  body { margin: 0; padding: 28px 32px; background: var(--bg); }
  .stack { display: grid; gap: 8px; }
  .row { display: flex; align-items: baseline; gap: 16px; flex-wrap: wrap; }
  .meta { font-family: var(--font-text); font-size: 10px; font-weight: 500; letter-spacing: var(--tr-mega); text-transform: uppercase; color: var(--fg-muted); min-width: 110px; }
  .display { font-family: var(--font-display); font-weight: 700; font-size: 80px; letter-spacing: -0.025em; line-height: 1; color: var(--fg); }
  .h1 { font-family: var(--font-display); font-weight: 700; font-size: 48px; letter-spacing: -0.025em; line-height: 1.05; }
  .h2 { font-family: var(--font-display); font-weight: 600; font-size: 30px; letter-spacing: -0.02em; line-height: 1.2; }
</style>
</head>
<body>
  <div class="stack">
    <div class="row"><div class="meta">display · 80</div><div class="display">nankin.</div></div>
    <div class="row"><div class="meta">h1 · 48</div><div class="h1">Gestão para arquitetos.</div></div>
    <div class="row"><div class="meta">h2 · 30 (manual)</div><div class="h2">Projetos, prazos e orçamentos em um lugar.</div></div>
  </div>
</body>
</html>
