<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Nankin · Variantes da marca</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  body { margin: 0; padding: 0; display: grid; grid-template-columns: repeat(4, 1fr); min-height: 160px; }
  .cell { display: grid; place-items: center; padding: 18px; position: relative; }
  .cell img { width: 60px; height: 60px; }
  .a { background: var(--nk-coral); }
  .b { background: var(--nk-white); border-right: 1px solid var(--border); }
  .c { background: var(--nk-black); }
  .d { background: var(--nk-white); border-left: 1px solid var(--border); }
  .label { position: absolute; bottom: 8px; font-family: var(--font-text); font-size: 9px; font-weight: 500; letter-spacing: var(--tr-mega); text-transform: uppercase; opacity: 0.55; }
  .label.dark { color: var(--nk-white); }
</style>
</head>
<body>
  <div class="cell a"><img src="../assets/icon-nankin.svg" style="filter: brightness(0) invert(1);" alt=""><span class="label dark">Negativo / coral</span></div>
  <div class="cell b"><img src="../assets/icon-nankin.svg" style="filter: brightness(0);" alt=""><span class="label">Positivo / branco</span></div>
  <div class="cell c"><img src="../assets/icon-nankin.svg" style="filter: brightness(0) invert(1);" alt=""><span class="label dark">Negativo / preto</span></div>
  <div class="cell d"><img src="../assets/icon-nankin.svg" alt="" style="filter: brightness(0) saturate(1) invert(54%) sepia(64%) saturate(1400%) hue-rotate(331deg) brightness(101%) contrast(95%);"><span class="label">Coral / branco</span></div>
</body>
</html>
